description: |
  A comprehensive Claude Code skill suite for the full lifecycle of Requests for
  Enhancement (RFEs) in the RHAIRFE Jira project. Covers creation from problem
  statements, multi-phase rubric-based review with technical feasibility checks
  and auto-revision, intelligent splitting of oversized RFEs, batch auto-fix at
  scale, and deterministic submission to Jira. A speedrun skill chains the whole
  pipeline end-to-end (create → auto-fix → submit) for a single idea, a set of
  existing Jira keys, or a YAML batch of ideas.

  The plugin uses a shared artifact convention -- all skills read from and write
  to an `artifacts/` directory, with YAML frontmatter (managed exclusively via
  `scripts/frontmatter.py`) carrying structured metadata on every task and review
  file. Jira write operations go through deterministic Python scripts (REST API +
  Basic Auth) rather than LLM tool-calling, so the exact sequence of API calls is
  reproducible; read operations prefer the Atlassian MCP server and fall back to
  the REST API. Long-running orchestrators persist state to `tmp/` via
  `scripts/state.py` so they survive context-compression boundaries. A dependency
  on the `assess-rfe` plugin provides the scoring rubric, bootstrapped
  automatically on first use.
architecture_notes: |
  The RFE skills (rfe.*) form the requirements pipeline. `rfe.speedrun` is the
  top-level orchestrator: it invokes `rfe.create`, `rfe.auto-fix`, and
  `rfe.submit` as sub-skills and never duplicates their work, persisting the ID
  list and flags between phases so the run is resumable.

  `rfe.review` is the central review orchestrator and is deliberately
  content-blind -- it never reads RFE bodies into its own context. Instead it
  launches parallel waves of sub-agents (fetch, assess, feasibility, review,
  revise), reads only YAML frontmatter via `scripts/frontmatter.py`, checks file
  existence via Glob, and polls for wave completion with
  `scripts/check_review_progress.py` (sleeping for the reported `NEXT_POLL`
  interval). Rubric assessment is delegated to the `assess-rfe` plugin (a
  dedicated `rfe-scorer` subagent), and per-RFE technical feasibility is delegated
  to the `rfe-feasibility-review` sub-agent. Failing RFEs are auto-revised and
  re-assessed for up to two cycles.

  `rfe.auto-fix` wraps the same building blocks into a non-interactive pipeline
  state machine (`scripts/pipeline_state.py`) with phased dispatch (fetch →
  bootstrap → assess → feasibility → review → revise → re-assess → split). It
  drives a strict `next-action` / `launch_wave` / `wait-for-wave` loop, processes
  IDs in configurable batches, and supports snapshot-based incremental fetch
  (`scripts/snapshot_fetch.py`) for resume and reprocessing. `rfe.split`
  decomposes oversized RFEs via parallel split agents, re-reviews the children
  through `rfe.review`, and runs a one-cycle right-sizing self-correction loop.

  Review artifacts follow a fixed layout under `artifacts/` (`rfe-tasks/`,
  `rfe-originals/`, `rfe-reviews/`), and `scripts/frontmatter.py rebuild-index`
  regenerates `rfes.md`. Architecture context is fetched from
  opendatahub-io/architecture-context into `.context/architecture-context/` and
  used by the feasibility fork to ground assessments in real platform components
  and APIs; human-authored overlays under `overlays/` take precedence over the
  generated docs. Note that `architecture-review`, `feasibility-review`,
  `scope-review`, and `testability-review` are forked strategy reviewers (they
  read `artifacts/strat-tasks/` and assess refined strategy features) shared with
  the strategy workflow; `rfe-feasibility-review` is the RFE-specific reviewer
  wired into `rfe.review`.
skills:
  rfe.create:
    description: |
      Generate new RFEs from a problem statement, idea, or need. Loads the
      assess-rfe rubric (bootstrapping it if needed), and unless run headless
      asks 2-5 clarifying questions about affected customers, business
      justification, the user's problem, size, and success criteria. Produces
      well-formed RFEs from a template that describe WHAT and WHY (business
      needs), never HOW (implementation) -- it explicitly avoids loading
      architecture context so it won't prescribe a solution. Determines each
      RFE's t-shirt size from its acceptance-criteria count via the Size Guide
      (S: 1-2, M: 3-5, L: 5-8, XL: 8+), allocates IDs atomically (or uses a
      pre-assigned `--rfe-id`), writes artifacts with YAML frontmatter via
      scripts/frontmatter.py, and rebuilds the index.
    argument_hint: "<problem-statement> [--headless] [--priority <value>] [--labels <csv>] [--rfe-id <ID>]"
    arguments:
      - name: "problem-statement"
        required: true
        description: "The problem statement, idea, or need to turn into RFEs"
      - name: "--headless"
        required: false
        description: "Skip clarifying questions (Step 2), generate RFEs directly from the input"
      - name: "--priority"
        type: "Blocker | Critical | Major | Normal | Minor"
        required: false
        default: "Normal"
        description: "Override default priority for created RFEs"
      - name: "--labels"
        type: "<comma-separated>"
        required: false
        description: "Labels to apply to created RFEs"
      - name: "--rfe-id"
        type: "<ID>"
        required: false
        description: "Pre-assigned RFE ID; use this instead of allocating a new one. The placeholder file must already exist."
    usage_examples:
      - "/rfe.create Users need better error messages when model serving fails"
      - "/rfe.create --headless --priority Critical Fix dashboard latency for large clusters"
      - "/rfe.create --headless --rfe-id RFE-003 --labels candidate-3.5 Support GPU sharing"
  rfe.review:
    description: |
      Score and improve RFEs with a multi-phase agent pipeline. Accepts one or
      more Jira keys (RHAIRFE-NNNN) or local IDs (RFE-NNN); missing RFEs are
      fetched from Jira first. The orchestrator never reads RFE content directly
      -- all content-heavy work is delegated to background sub-agents (fetch,
      assess, feasibility, review, revise) launched in parallel waves and polled
      via scripts/check_review_progress.py. It runs rubric-based assessment
      (assess-rfe / rfe-scorer subagent), launches per-RFE feasibility checks
      (rfe-feasibility-review), synthesizes scored review files, auto-revises
      failing RFEs (filter_for_revision.py), and re-assesses up to 2 cycles,
      preserving cumulative scores and revision history across cycles. Can return
      headlessly to a calling skill (auto-fix or split) or print an interactive
      summary with next-step suggestions.
    argument_hint: "<ID> [ID2 ...] [--headless] [--caller <name>]"
    arguments:
      - name: "ID"
        required: true
        description: "One or more space-separated RFE IDs (RHAIRFE-NNNN or RFE-NNN)"
      - name: "--headless"
        required: false
        description: "Suppress end-of-run summary; used when called from rfe.auto-fix or rfe.split"
      - name: "--caller"
        type: "autofix | split | none"
        required: false
        default: "none"
        description: "Identifies calling skill for headless return routing"
    usage_examples:
      - "/rfe.review RHAIRFE-1234"
      - "/rfe.review RFE-001 RFE-002 RFE-003"
      - "/rfe.review --headless --caller autofix RHAIRFE-1234 RHAIRFE-5678"
  rfe.split:
    description: |
      Decompose oversized RFEs into appropriately-scoped pieces. Runs
      non-interactively: launches parallel split agents that analyze each parent
      RFE and generate child RFEs, collects the children (collect_children.py),
      then invokes rfe.review on all of them via an inline Skill call. Includes a
      right-sizing self-correction loop (1 cycle max) that re-splits any child
      still scoring below 2/2 on right-sizing, validates that all original scope
      is covered, and archives the parent RFE. Parents assessed as "no-split"
      have their recommendation downgraded to `revise` so downstream consumers
      don't treat them as pending splits.
    argument_hint: "<ID> [ID2 ...] [--headless]"
    arguments:
      - name: "ID"
        required: true
        description: "One or more space-separated RFE IDs (RHAIRFE-NNNN or RFE-NNN) to split"
      - name: "--headless"
        required: false
        description: "Suppress end-of-run summary; used when called from rfe.auto-fix"
    usage_examples:
      - "/rfe.split RHAIRFE-1234"
      - "/rfe.split RHAIRFE-1234 RHAIRFE-5678"
  rfe.submit:
    description: |
      Push RFEs to Jira via deterministic Python scripts (scripts/submit.py)
      using the REST API with Basic Auth. Creates new RHAIRFE tickets for new
      RFEs or updates existing tickets for fetched RFEs, then rebuilds
      artifacts/rfes.md and reports results. Applies labels automatically based
      on pipeline outcomes (auto-created, auto-revised, split-original,
      split-result, needs-attention, rubric-pass, and the three mutually
      exclusive feasibility verdicts). Non-interactive by design -- invoking the
      skill is the confirmation, no dry-run approval step. Requires JIRA_SERVER,
      JIRA_USER, and JIRA_TOKEN environment variables.
    argument_hint: "[--dry-run] [--artifacts-dir <path>]"
    arguments:
      - name: "--dry-run"
        required: false
        description: "Validate locally without writing to Jira"
      - name: "--artifacts-dir"
        type: "<path>"
        required: false
        default: "artifacts"
        description: "Path to the artifacts directory"
    usage_examples:
      - "/rfe.submit"
      - "/rfe.submit --dry-run"
  rfe.speedrun:
    description: |
      Execute the full RFE pipeline end-to-end -- create, auto-fix (review +
      revise + split), and submit -- with minimal interaction. Detects one of
      three modes: batch YAML input (multiple ideas in a file), one or more
      existing Jira keys, or a single free-text idea. In batch mode it validates
      the input file with validate_batch_input.py --strict before spending any
      agent budget, pre-allocates all RFE IDs, and launches one parallel
      rfe.create agent per entry. It always passes an explicit --batch-size to
      auto-fix for reproducibility, then verifies completeness with
      check_autofix_complete.py and re-invokes auto-fix on any missing IDs (up to
      3 retries). Orchestrates purely by invoking rfe.create, rfe.auto-fix, and
      rfe.submit, persisting config and IDs to disk between phases to survive
      context compression.
    argument_hint: "<idea-or-key> [--input <path>] [--headless] [--dry-run] [--batch-size N] [--announce-complete]"
    arguments:
      - name: "idea-or-key"
        required: false
        description: "A free-text idea or Jira key (RHAIRFE-NNNN). Mutually exclusive with --input."
      - name: "--input"
        type: "<path>"
        required: false
        description: "Path to a YAML file with batch entries (prompt, priority, labels per entry)"
      - name: "--headless"
        required: false
        description: "Suppress questions and confirmations (for CI/eval)"
      - name: "--dry-run"
        required: false
        description: "Skip Jira writes in submit phase"
      - name: "--batch-size"
        type: "<N>"
        required: false
        default: "5"
        description: "Override batch size for auto-fix phase (always passed through explicitly)"
      - name: "--announce-complete"
        required: false
        description: "Print completion marker when done (for CI/eval harnesses)"
    usage_examples:
      - "/rfe.speedrun Better dashboard for ML model monitoring"
      - "/rfe.speedrun RHAIRFE-1234"
      - "/rfe.speedrun --input batch.yaml --headless --dry-run"
      - "/rfe.speedrun --input batch.yaml --headless --batch-size 10 --announce-complete"
  rfe.auto-fix:
    description: |
      Non-interactive batch pipeline for reviewing, revising, and splitting RFEs
      at scale. Accepts explicit IDs or a JQL query (with --limit and --random
      sampling) to fetch from Jira. Runs a pipeline state machine
      (pipeline_state.py) with phased dispatch -- fetch, bootstrap, assess,
      feasibility, review, revise, re-assess, and split -- driven by a strict
      next-action / launch_wave / wait-for-wave loop that must run to completion
      (no early exit, context compression handled automatically). Processes IDs in
      configurable batches with snapshot-based incremental fetch
      (snapshot_fetch.py) for resume and --reprocess support, then emits a run
      report and counts summary.
    argument_hint: "<IDs...> | --jql <query> [--limit N] [--batch-size N] [--headless] [--reprocess] [--random N] [--announce-complete] [--data-dir <path>]"
    arguments:
      - name: "IDs"
        required: false
        description: "Explicit RFE IDs to process (space-separated)"
      - name: "--jql"
        type: "<query>"
        required: false
        description: "JQL query to fetch RFE IDs from Jira"
      - name: "--limit"
        type: "<N>"
        required: false
        description: "Max number of results from JQL query"
      - name: "--batch-size"
        type: "<N>"
        required: false
        default: "50"
        description: "Process IDs in batches of this size"
      - name: "--data-dir"
        type: "<path>"
        required: false
        description: "Directory for snapshot data"
      - name: "--headless"
        required: false
        description: "Non-interactive mode"
      - name: "--reprocess"
        required: false
        description: "Reprocess RFEs that had prior runs"
      - name: "--random"
        type: "<N>"
        required: false
        description: "Process N random RFEs from the result set"
      - name: "--announce-complete"
        required: false
        description: "Print completion marker when done"
    usage_examples:
      - "/rfe.auto-fix RFE-001 RFE-002 RFE-003"
      - '/rfe.auto-fix --jql "project=RHAIRFE AND status=New" --limit 20'
      - '/rfe.auto-fix --jql "project=RHAIRFE" --reprocess --random 5'
  rfe-creator.update-deps:
    description: |
      Force-update all vendored dependencies by removing cached copies and
      re-fetching. Refreshes the assess-rfe skills (assess-rfe / export-rubric,
      via scripts/bootstrap-assess-rfe.sh) and the architecture context (from
      opendatahub-io/architecture-context, via scripts/fetch-architecture-context.sh),
      then reports what was updated and the versions fetched. Has
      disable-model-invocation set, so it can only be triggered explicitly by the
      user.
    usage_examples:
      - "/rfe-creator.update-deps"
  rfe-feasibility-review:
    description: |
      Internal sub-agent (model: opus) launched per RFE by rfe.review. Acts as a
      senior engineer looking for blockers and risks rather than confirming the
      work is good. Reads the RFE task file (and Jira comment history if present),
      grounds its assessment in architecture context (LATEST_VERSION / PLATFORM.md
      plus active overlays filtered by status, release, and affected components),
      and reads any prior review report for re-reviews. Emits one of three
      verdicts -- feasible (can be built), infeasible (platform architecture
      fundamentally conflicts), or indeterminate (RFE too ambiguous to assess) --
      distinguishing "capability doesn't exist yet" (feasible) from
      "architecturally incompatible" (infeasible). Named components absent from
      the architecture inventory are treated as strategy considerations, not
      blockers. Writes to artifacts/rfe-reviews/{ID}-feasibility.md.
  architecture-review:
    description: |
      Internal forked reviewer sub-agent (context: fork, model: opus) for the
      strategy workflow. Acts as a platform architect assessing refined strategy
      features in artifacts/strat-tasks/ (cross-referenced against source RFEs)
      for architectural correctness: verifies every dependency against the
      architecture docs, checks integration patterns match how components actually
      communicate, ensures component boundaries aren't violated, validates the
      deployment model, and flags architectural conflicts and cross-component
      coordination needs (versioning, rollout order, backwards compatibility).
      Applies architecture-context overlays as authoritative corrections, skips
      cleanly when no architecture context is available, and grounds every
      finding in specific docs, components, or APIs.
  feasibility-review:
    description: |
      Internal forked reviewer sub-agent (context: fork, model: opus) for the
      strategy workflow. Acts as a staff engineer assessing refined strategy
      features in artifacts/strat-tasks/ for technical feasibility: whether the
      proposed approach actually works, whether it delivers what the source RFE
      asks for (flagging silent scope reduction), whether the effort estimate /
      T-shirt size is credible, and what hidden dependencies or integration
      challenges will surface during implementation. Grounds assessments in
      architecture context and overlays, takes an adversarial stance toward
      optimistic estimates, and emits an approve / revise / reject recommendation.
  scope-review:
    description: |
      Internal forked reviewer sub-agent (context: fork, model: opus) for the
      strategy workflow. Acts as a product owner assessing whether each refined
      strategy in artifacts/strat-tasks/ is right-sized -- not so big it needs
      splitting, not so small it's just a task -- and scoped to match its effort
      estimate. Checks that scope is explicitly bounded, that the strategy
      delivers a complete capability, and that it neither silently expands nor
      shrinks the source RFE. Flags scope-trap phrasing ("and related
      functionality", "full support for"), and when recommending a split suggests
      concrete boundaries for each resulting strategy.
  testability-review:
    description: |
      Internal forked reviewer sub-agent (context: fork, model: opus) for the
      strategy workflow. Acts as a test engineer determining whether each refined
      strategy in artifacts/strat-tasks/ can be validated: are acceptance criteria
      testable and success criteria measurable (with a baseline), what edge cases
      are missing (failure modes, boundary conditions, concurrent access,
      large-scale, backwards compatibility), what test strategy is needed, and can
      the non-functional requirements (performance, scalability, security) be
      tested. Suggests concrete rewrites for vague criteria and emits an approve /
      revise-criteria / add-test-plan recommendation.
