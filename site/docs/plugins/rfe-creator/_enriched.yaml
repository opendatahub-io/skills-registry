description: |
  rfe-creator turns a problem statement into a tracked, reviewed Jira work item
  without a human writing the ticket. Since 0.2.0 it is **type-generic**: one
  pipeline serves every registered work-item type — RFEs in the RHAIRFE project
  by default, Initiatives in RHOAIENG with `--type initiative` — instead of a
  separate skill set per type. Each type is a data-only descriptor at
  `types/<type>/type.yaml`, and every skill body renders its paths, labels,
  rubric, size rules and review dimensions from the `launch-vars` block that
  `scripts/type_registry.py` prints for the resolved type. Adding a type is a
  descriptor, not a fork of the skills.

  Six skills make the pipeline. `/rfe-create` interviews you (or runs
  `--headless` from a batch) and writes the item. `/rfe-review` scores it against
  the type's rubric, runs the type's review dimensions — technical feasibility
  for RFEs, feasibility plus strategic alignment for Initiatives — and
  auto-revises what fails, over at most two re-assessment cycles. `/rfe-split`
  decomposes an oversized item into right-sized children and reviews them, with
  one self-correction cycle. `/rfe-submit` writes to Jira through the REST API.
  `/rfe-auto-fix` drives the same work over whole batches as a non-interactive
  state machine — it re-runs the very same agent prompt files rather than
  calling the skills — and `/rfe-speedrun` chains create → auto-fix → submit end
  to end. A seventh skill, `/rfe-creator.update-deps`, re-vendors the pinned
  assess-rfe rubric and the architecture context.

  The orchestrating skills never read item bodies into their own context. They
  launch background agents for all content-heavy work and communicate with them
  only through files on disk: frontmatter via `scripts/frontmatter.py`, run state
  via `scripts/state.py`, and completion via polling `check_review_progress.py`.
  That is what lets a batch run survive context compression — every ID list,
  cycle counter and flag is re-read from `tmp/` rather than remembered.

  The legacy dotted commands (`/rfe.create` and friends) still work. Since 0.2.0
  they are ten-line compatibility aliases that bootstrap the layout and then
  delegate to their generic sibling, so they have no workflow of their own.

architecture_notes: |
  **Type resolution.** Every skill's Step 0 resolves the work-item type
  (`type_registry.py resolve`) and then prints a launch block
  (`type_registry.py launch-vars <type> <stage>`). Each `{VAR}` in a skill body —
  `{TASKS_DIR}`, `{REVIEWS_DIR}`, `{ID_FIELD}`, `{DIMENSIONS}`, `{STATE_PREFIX}`,
  `{SCORER_AGENT}` — is a line in that block, and the whole block is prepended to
  every agent prompt. The `{STATE_PREFIX}` (empty for RFEs, `initiative-` for
  Initiatives) keeps concurrent runs of different types from colliding in `tmp/`.

  **Layout check.** A marketplace install has no `scripts/` or `types/` in the
  working directory, so each skill runs `scripts/bootstrap.sh --layout` once
  through its own plugin path to link them in. Thereafter every command in the
  body runs verbatim as a relative path — the headless permission allowlist
  matches command text literally, so absolute paths would be denied.

  **Orchestrator / agent split.** `/rfe-review`, `/rfe-split` and `/rfe-auto-fix`
  are orchestrators: they launch opus background agents (fetch, assess, dimension,
  review, revise, split) and read back only structured frontmatter. The contract
  between them is the filesystem — an agent is "done" when its output file exists
  and parses, which `check_review_progress.py` polls with a script-supplied
  `NEXT_POLL` backoff.

  **State machine.** `/rfe-auto-fix` is not a caller of the other skills — its
  `allowed-tools` is `Bash, Agent`, so it has no Skill tool at all. It is a
  second, headless implementation of the same work that launches agents directly
  against the same prompt files — `.claude/skills/rfe-review/prompts/*.md` for
  the review waves, and the typed descriptor paths
  `types/<type>/dimensions/*.md` and `types/<type>/prompts/split-rules.md` for
  the dimension and split waves — replacing the hand-rolled polling with
  `scripts/pipeline_state.py`, a 31-phase machine (`BATCH_START` → `FETCH` →
  `SETUP` → `ASSESS` → `REVIEW` → `REVISE` → `FIXUP` → the `REASSESS_*` block →
  `COLLECT` → the `SPLIT_*` block → `BATCH_DONE` → `ERROR_COLLECT` → `REPORT` →
  `DONE`). The skill loops on `next-action`, executes `run_script` or
  `launch_wave`, and blocks on `wait-for-wave`; a `Stop` hook re-enters the loop
  if a turn ends before `DONE`.

  **Scoring.** The rubric comes from the assess-rfe plugin, vendored by
  `scripts/bootstrap.sh` at the commit the descriptors pin
  (`pipeline.rubric.ref`, one shared value both types must agree on) and exported
  to `artifacts/rfe-rubric.md`. `/rfe-create` reads it to shape its questions so
  what it writes will pass.

  **Jira.** Writes go through `scripts/submit.py` over the REST API with Basic
  Auth rather than the MCP server, so the call sequence is deterministic rather
  than dependent on tool-calling decisions. Reads prefer the Atlassian MCP server
  and fall back to `scripts/fetch_issue.py`.

skills:
  rfe-create:
    description: |
      Writes a new work item from a problem statement, idea or objective — an RFE
      capturing business needs (WHAT and WHY) by default, an Initiative with
      `--type initiative`. It resolves the type, loads the type's rubric
      (bootstrapping and exporting it if absent), reads the type's creation
      guidance, and asks at most 2-5 clarifying questions — only what it cannot
      infer from the input. `--headless` skips the questions but still reads the
      guidance.

      Items are written from the type's template to `{TASKS_DIR}/<ID>.md`. IDs are
      allocated atomically by `next_rfe_id.py` unless `--id` pre-assigned one, and
      all frontmatter is set through `frontmatter.py set` against the type's
      schema — never written by hand. For a type that sizes its items, the Size
      Guide assigns S/M/L/XL from the acceptance-criteria count.
    argument_hint: "[--type <t>] [--headless] [--priority <value>] [--labels <csv>] [--id <ID>] [--parent <KEY>] <problem statement>"
    arguments:
      - name: "problem statement"
        required: true
        description: "The idea, need or objective to turn into a work item. Free text, taken from whatever arguments remain after the flags."
      - name: "--type"
        type: "(type name)"
        required: false
        default: "rfe"
        description: "Work-item type to create. An explicit --type always wins over inference."
      - name: "--headless"
        required: false
        description: "Ask no clarifying questions — generate the item directly from the input. The type's guidance is still read."
      - name: "--priority"
        type: "(Blocker|Critical|Major|Normal|Minor)"
        required: false
        default: "Normal"
        description: "Override the default priority. Jira values only — never High/Medium/Low."
      - name: "--labels"
        type: "(comma-separated)"
        required: false
        description: "Labels to apply to the created item."
      - name: "--id"
        type: "(ID)"
        required: false
        description: "Use this pre-assigned ID instead of allocating one. The placeholder file already exists. --rfe-id / --initiative-id are accepted as aliases."
      - name: "--parent"
        type: "(Jira key)"
        required: false
        description: "Parent key to set on the created item. Offered only for a type whose batch entries carry parent_key — PARENT_FLAG is empty for rfe, so in practice this is the Initiative type."
    usage_examples:
      - "/rfe-create Users need to verify model signatures at serving time"
      - "/rfe-create --type initiative Establish a trusted model supply chain for RHOAI"
      - "/rfe-create --headless --priority Critical --labels candidate-3.5 TrustyAI operator crashes on large clusters"

  rfe-review:
    description: |
      Scores work items against the type's rubric and auto-revises what fails. It
      accepts Jira keys (fetched if not already local) or reviews the local
      artifacts `/rfe-create` wrote.

      It is an orchestrator: it never reads item bodies into its own context, only
      frontmatter. For each ID it launches an assess agent plus one agent per
      declared review dimension — technical feasibility for RFEs, strategic
      alignment for Initiatives — each with its own blocking and condition rules.
      A review agent then merges those results into
      `{REVIEWS_DIR}/<ID>-review.md`, and `filter_for_revision.py` selects which
      items a revise agent should rewrite.

      Revised items are re-assessed from scratch for at most two cycles. Before
      each cycle the review and assess results are deleted so progress detection
      works, with `preserve_review_state.py` saving and restoring the cumulative
      before-scores and revision history across the teardown. An agent that dies
      mid-run leaves no output file, so the ID gets an error stub and drops out of
      the batch rather than stalling it.
    argument_hint: "[--type <t>] [--headless] [--caller <name>] <ID> [ID2 ...]"
    arguments:
      - name: "ID"
        required: true
        description: "One or more space-separated item IDs — the type's Jira key form or local id form. A key with no local task file is fetched from Jira first."
      - name: "--type"
        type: "(type name)"
        required: false
        default: "rfe"
        description: "Work-item type to review. An explicit --type always wins."
      - name: "--headless"
        required: false
        description: "Suppress the end-of-run summary and emit a completion marker instead."
      - name: "--caller"
        type: "(split|none)"
        required: false
        default: "none"
        description: "Identifies the calling skill so a headless run returns to it. /rfe-split passes --caller split."
    usage_examples:
      - "/rfe-review RHAIRFE-1595"
      - "/rfe-review RHAIRFE-1595 RHAIRFE-1602 RFE-001"
      - "/rfe-review --type initiative INIT-001"

  rfe-split:
    description: |
      Decomposes an oversized work item into right-sized children that together
      cover the original scope. It takes IDs already in the workspace — fetched by
      `/rfe-review` or written by `/rfe-create` — and skips any ID with no local
      task file.

      It runs non-interactively. A split agent per parent applies the type's own
      decomposition rules (`{SPLIT_RULES_PATH}`) and writes
      `{REVIEWS_DIR}/<ID>-split-status.yaml`; a parent whose status says
      `no-split` (delivery-coupled, say) has its recommendation set back to
      `revise` so downstream consumers don't keep treating it as pending.
      Children are collected and handed to `/rfe-review` as an inline headless
      call.

      One self-correction cycle follows: any child scoring below half the type's
      `resplit` threshold on `right_sized` is split again and its children
      reviewed. It stops there by design — repeated re-splitting compounds the
      child count for diminishing returns, so a decomposition still wrong after
      one correction needs human judgement. The loop corrects grouping mistakes
      only; every other criterion is `/rfe-review`'s auto-revision to fix.
    argument_hint: "[--type <t>] [--headless] <ID> [ID2 ...]"
    arguments:
      - name: "ID"
        required: true
        description: "One or more space-separated IDs of items already in the workspace. An ID with no local task file is reported and skipped."
      - name: "--type"
        type: "(type name)"
        required: false
        default: "rfe"
        description: "Work-item type to split. An explicit --type always wins."
      - name: "--headless"
        required: false
        description: "Suppress the end-of-run summary and emit a completion marker instead."
    usage_examples:
      - "/rfe-split RHAIRFE-1234"
      - "/rfe-split RHAIRFE-1234 RHAIRFE-5678"
      - "/rfe-split --type initiative INIT-001"

  rfe-submit:
    description: |
      Creates or updates the type's Jira tickets from reviewed artifacts — new
      RHAIRFE tickets for RFEs, RHOAIENG Initiative tickets for Initiatives, or
      updates to tickets already fetched from Jira.

      Submission goes through `scripts/submit.py` against the Jira REST API with
      Basic Auth (`JIRA_SERVER`, `JIRA_USER`, `JIRA_TOKEN`), not the MCP server,
      so the exact call sequence is deterministic rather than dependent on
      tool-calling decisions. On submit, `RFE-NNN.md` is renamed to its Jira key
      — along with its companion files and its review file — and `tracker_ref`
      and `type` are written into the task and review frontmatter.

      The skill is deliberately non-interactive — invoking it is the confirmation,
      so it does not ask again. A headless invocation (the `/rfe-speedrun` Phase 3
      handoff, or CI) adds `--hold-interrupted`, which holds back any item whose
      body changed while its review never recorded `auto_revised`, rather than
      publishing it. The scripts apply the type's label family automatically:
      `auto_created`, `auto_revised`, `split_original`, `split_result`,
      `needs_attention`, `rubric_pass`, and one mutually-exclusive
      `<dimension>.<verdict>` label per declared review dimension. Those are the
      descriptor *keys*; the string actually pushed to Jira is the key's value in
      `conventions.labels`, each prefixed `<LABEL_PREFIX>-` (for RFEs,
      `rfe-creator-feasibility-pass`, `rfe-creator-autofix-rubric-pass`, …).
    argument_hint: "[--type <t>] [--dry-run] [--headless] [ID ...]"
    arguments:
      - name: "ID"
        required: false
        description: "Explicit item IDs to submit. With none given, the script submits the reviewed artifacts that are ready."
      - name: "--type"
        type: "(type name)"
        required: false
        default: "rfe"
        description: "Work-item type to submit. An explicit --type always wins."
      - name: "--dry-run"
        required: false
        description: "Validate locally and skip all Jira writes."
      - name: "--headless"
        required: false
        description: "Non-interactive invocation — adds --hold-interrupted so an item edited outside the pipeline is held for a human instead of published."
    usage_examples:
      - "/rfe-submit"
      - "/rfe-submit --dry-run"
      - "/rfe-submit --type initiative INIT-001"

  rfe-speedrun:
    description: |
      Runs the whole pipeline end to end — create, auto-fix, submit — from a single
      idea, a Jira key, or a YAML batch file, with as little interaction as
      possible.

      Step 0 resolves the type, cleans `tmp/`, and pins every flag (notably
      `batch_size`, which must be a concrete integer) into
      `tmp/{STATE_PREFIX}speedrun-config.yaml` so the run is reproducible and
      survives compression. It then picks a mode: **A** a `--input` batch YAML,
      **B** an existing Jira key (skip create), or **C** a single free-text idea.

      Mode A validates the batch with `--strict` before spending any agent budget,
      pre-allocates every ID, then fans out one `/rfe-create` agent per entry —
      passing each entry's `clarifying_context` verbatim inside a delimited block
      as data, never as instructions. Completion is a blocking barrier on the task
      files, not agent notifications: the same IDs pending across three exit-3
      results means those agents are dead and get relaunched. Phase 2 hands off to
      `/rfe-auto-fix` via the Skill tool (Agent would background it and end the
      session) and verifies with `check_autofix_complete.py`, retrying the missing
      IDs up to three times. Phase 3 submits only the IDs
      `collect_recommendations.py` reports as passing.
    argument_hint: "[--type <t>] [--input <path>] [--headless] [--announce-complete] [--dry-run] [--batch-size N] <idea | Jira key>"
    arguments:
      - name: "idea | Jira key"
        required: false
        description: "A free-text idea or objective (mode C), or a single Jira key to process an existing item (mode B). Omit when using --input."
      - name: "--type"
        type: "(type name)"
        required: false
        default: "rfe"
        description: "Work-item type for the run. An explicit --type always wins."
      - name: "--input"
        type: "(path)"
        required: false
        description: "YAML file of batch entries (prompt, priority, labels, clarifying_context) — mode A. May also be a mapping with type and items keys."
      - name: "--headless"
        required: false
        description: "Suppress questions and confirmations, for CI and eval runs."
      - name: "--announce-complete"
        required: false
        description: "Print a completion marker when done, for CI and eval harnesses."
      - name: "--dry-run"
        required: false
        description: "Skip the Jira writes in the submit phase."
      - name: "--batch-size"
        type: "(integer)"
        required: false
        default: "5"
        description: "Batch size forwarded to auto-fix. Always passed explicitly so runs stay reproducible."
    usage_examples:
      - "/rfe-speedrun Users need to verify model signatures at serving time"
      - "/rfe-speedrun --input batch.yaml --headless --announce-complete"
      - "/rfe-speedrun --type initiative --dry-run RHOAIENG-12345"

  rfe-auto-fix:
    description: |
      Reviews, revises and splits batches of work items non-interactively. It
      takes explicit IDs or a JQL query and makes every decision autonomously.

      Where `/rfe-review` hand-rolls its polling, auto-fix delegates control to
      `scripts/pipeline_state.py` — a 31-phase state machine running `BATCH_START`
      → `FETCH` → `SETUP` → `ASSESS` → `REVIEW` → `REVISE` → `FIXUP`, the
      `REASSESS_*` block, `COLLECT`, the `SPLIT_*` block, `BATCH_DONE`,
      `ERROR_COLLECT`, `REPORT`, `DONE`. The skill loops on `next-action` and
      executes what it returns: `run_script` runs a phase, `launch_wave` launches
      the listed background agents with pre-rendered variables, and every wave is
      followed by the blocking `wait-for-wave` barrier (exit 3 means re-run it).

      In JQL mode `snapshot_fetch.py` fetches only what is new or changed since
      the last run, so an idle re-run legitimately processes zero IDs and goes
      straight to `done`. The loop must reach `DONE` on its own — the skill body
      explicitly tells the model to ignore any impulse to stop early for budget,
      and a `Stop` hook re-enters the loop if a turn ends first.
    argument_hint: "[--type <t>] [--jql \"<query>\"] [--limit N] [--batch-size N] [--data-dir <path>] [--headless] [--announce-complete] [--reprocess] [--random N] [ID ...]"
    arguments:
      - name: "ID"
        required: false
        description: "Explicit item IDs to process. Omit when using --jql or --reprocess."
      - name: "--type"
        type: "(type name)"
        required: false
        default: "rfe"
        description: "Work-item type to process. An explicit --type always wins; a headless run with no type and no IDs resolves to rfe."
      - name: "--jql"
        type: "(query)"
        required: false
        description: "Fetch the batch from Jira by JQL. The query's project is cross-checked against the resolved type's binding."
      - name: "--limit"
        type: "(integer)"
        required: false
        description: "Cap the number of issues the JQL fetch returns."
      - name: "--batch-size"
        type: "(integer)"
        required: false
        default: "50"
        description: "Number of IDs processed per batch."
      - name: "--data-dir"
        type: "(path)"
        required: false
        description: "Alternate data directory for the snapshot fetch."
      - name: "--headless"
        required: false
        description: "Non-interactive run (the default posture for this skill)."
      - name: "--announce-complete"
        required: false
        description: "Print a completion marker when the pipeline reaches DONE."
      - name: "--reprocess"
        required: false
        description: "Reprocess already-seen issues instead of only new or changed ones. Works with or without --jql."
      - name: "--random"
        type: "(integer)"
        required: false
        description: "Sample N issues at random from the fetch result."
    usage_examples:
      - "/rfe-auto-fix RHAIRFE-1595 RHAIRFE-1602"
      - "/rfe-auto-fix --jql \"project = RHAIRFE AND status = New\" --limit 20"
      - "/rfe-auto-fix --type initiative --reprocess --batch-size 10"

  rfe-creator.update-deps:
    description: |
      Force re-vendors the plugin's dependencies: the assess-rfe skills at the
      commit the type descriptors pin, and the latest architecture context. Use it
      after bumping `pipeline.rubric.ref` or to repair a stale copy. It is
      `disable-model-invocation: true` — a maintenance command you run from the
      slash menu, never something the model delegates to on its own.

      It removes everything `scripts/bootstrap.sh` installs — the
      `.context/assess-rfe` checkout, the vendored `assess-rfe`,
      `assess-initiative` and `export-rubric` skill directories, and the
      `rfe-scorer` / `initiative-scorer` agent definitions — then re-runs the
      bootstrap, and separately refreshes `.context/architecture-context`.

      Note that re-running alone will not pick up newer assess-rfe commits: the
      bootstrap checks out the pinned `pipeline.rubric.ref`, which
      `types/rfe/type.yaml` and `types/initiative/type.yaml` must both carry at
      the same value (`validate_types.py` refuses two different pins). To move the
      rubric, bump both descriptors first, then run this skill.
    usage_examples:
      - "/rfe-creator.update-deps"

  rfe.create:
    description: |
      Compatibility alias for `/rfe-create`, kept so existing `/rfe.create`
      invocations keep working. It runs the layout bootstrap once, then reads its
      generic sibling's SKILL.md and follows it from Step 0 with the same
      arguments. Prefer `/rfe-create` (Initiatives: `/rfe-create --type
      initiative`).
    usage_examples:
      - "/rfe.create Users need to verify model signatures at serving time"

  rfe.review:
    description: |
      Compatibility alias for `/rfe-review`, kept so existing `/rfe.review`
      invocations keep working. It runs the layout bootstrap once, then reads its
      generic sibling's SKILL.md and follows it from Step 0 with the same
      arguments. Prefer `/rfe-review` (Initiatives: `/rfe-review --type
      initiative`).
    usage_examples:
      - "/rfe.review RHAIRFE-1595"

  rfe.split:
    description: |
      Compatibility alias for `/rfe-split`, kept so existing `/rfe.split`
      invocations keep working. It runs the layout bootstrap once, then reads its
      generic sibling's SKILL.md and follows it from Step 0 with the same
      arguments. Prefer `/rfe-split` (Initiatives: `/rfe-split --type
      initiative`).
    usage_examples:
      - "/rfe.split RHAIRFE-1234"

  rfe.submit:
    description: |
      Compatibility alias for `/rfe-submit`, kept so existing `/rfe.submit`
      invocations keep working. It runs the layout bootstrap once, then reads its
      generic sibling's SKILL.md and follows it from Step 0 with the same
      arguments. Prefer `/rfe-submit` (Initiatives: `/rfe-submit --type
      initiative`).
    usage_examples:
      - "/rfe.submit"

  rfe.speedrun:
    description: |
      Compatibility alias for `/rfe-speedrun`, kept so existing `/rfe.speedrun`
      invocations keep working. It runs the layout bootstrap once, then reads its
      generic sibling's SKILL.md and follows it from Step 0 with the same
      arguments. Prefer `/rfe-speedrun` (Initiatives: `/rfe-speedrun --type
      initiative`).
    usage_examples:
      - "/rfe.speedrun Users need to verify model signatures at serving time"

  rfe.auto-fix:
    description: |
      Compatibility alias for `/rfe-auto-fix`, kept so existing `/rfe.auto-fix`
      invocations keep working. It runs the layout bootstrap once, then reads its
      generic sibling's SKILL.md and follows it from Step 0 with the same
