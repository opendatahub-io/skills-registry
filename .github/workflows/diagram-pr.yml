name: Diagram PR Sync

on:
  pull_request:
    paths:
      - 'site/docs/plugins/**/*.svg'

jobs:
  sync-drawio:
    # This job commits back to the PR head branch, which only works for branches
    # in this repository: `github.head_ref` is resolved against the base repo, and
    # GITHUB_TOKEN is read-only for pull requests from forks. Fork PRs are skipped
    # rather than failed -- a maintainer runs scripts/sync_drawio_from_svg.py after
    # merge, or pushes the sync to the fork branch directly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Find changed SVGs
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Diff against the branch point, not the base tip, so diagrams changed on
          # main since the branch was cut are not mistaken for changes in this PR.
          base=$(git merge-base "$BASE_SHA" HEAD)
          echo "base=$base" >> $GITHUB_OUTPUT

          # If drawio files were also changed, this is a batch update — skip sync
          changed_drawio=$(git diff --name-only "$base"..HEAD -- 'site/docs/plugins/**/*.drawio')
          if [ -n "$changed_drawio" ]; then
            echo "svgs=" >> $GITHUB_OUTPUT
            echo "Batch update detected (drawio files changed) — skipping sync"
            exit 0
          fi

          changed_svgs=$(git diff --name-only "$base"..HEAD -- 'site/docs/plugins/**/*.svg')
          if [ -z "$changed_svgs" ]; then
            echo "svgs=" >> $GITHUB_OUTPUT
            echo "No SVG changes detected"
          else
            echo "svgs<<EOF" >> $GITHUB_OUTPUT
            echo "$changed_svgs" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Validate SVGs have embedded draw.io data
        if: steps.changed.outputs.svgs != ''
        env:
          SVGS: ${{ steps.changed.outputs.svgs }}
        run: |
          while IFS= read -r svg; do
            if [ -f "$svg" ] && ! grep -q "mxfile\|mxGraphModel" "$svg"; then
              echo "WARNING: $svg does not contain embedded draw.io data"
            fi
          done <<< "$SVGS"

      - name: Sync drawio files from SVGs
        if: steps.changed.outputs.svgs != ''
        env:
          SVGS: ${{ steps.changed.outputs.svgs }}
        run: |
          # Unquoted on purpose: SVGS is a newline-separated list of paths
          python3 scripts/sync_drawio_from_svg.py $SVGS

      - name: Commit updated drawio files
        if: steps.changed.outputs.svgs != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'site/docs/plugins/**/*.drawio'
          if git diff --cached --quiet; then
            echo "No drawio changes to commit"
          else
            git commit -m "Sync drawio files from edited SVGs"
            git push
          fi

      - name: Extract before/after pairs for eval dataset
        if: steps.changed.outputs.svgs != ''
        env:
          BASE: ${{ steps.changed.outputs.base }}
          SVGS: ${{ steps.changed.outputs.svgs }}
        run: |
          pip install pyyaml
          # Unquoted on purpose: SVGS is a newline-separated list of paths
          python3 scripts/extract_diagram_feedback.py --base-ref "$BASE" --svgs $SVGS

      - name: Upload feedback cases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagram-feedback-cases
          path: eval/diagram-feedback/cases/
          if-no-files-found: ignore
