                  privacy: organization_private
          source_assertions:
            skill_path: skills/eval-mlflow/SKILL.md
            supporting_paths:
              - skills/eval-mlflow/scripts/sync_dataset.py
              - skills/eval-mlflow/scripts/log_results.py
              - skills/eval-mlflow/scripts/attach_feedback.py
              - skills/eval-mlflow/scripts/from_traces.py
              - skills/eval-mlflow/scripts/trace_from_stdout.py
      - name: eval-optimize
        description: "Automated skill-improvement loop: runs evals, diagnoses judge failures from traces, edits the SKILL.md, re-runs, and iterates until judges pass without regressions."
        user-invocable: true
        contract:
          version: canonical-skill-v1
          functions: [orchestrate, transform]
          metrics:
            - id: task_success
              measure: verifier_backed
              verifier_ref: opendatahub-io/agent-eval-harness@1559af5d404128ed3458d1a9bdb4580c76244b01:skills/eval-run/scripts/score.py
          problem_statement: "Autonomously improve a skill (or prompt-mode artifact) by looping over eval results: identify which judges failed and why from rationale and transcripts, form grounded hypotheses, apply surgical edits to the SKILL.md under test, re-run the eval, and check for regressions until judges pass or the max-iteration limit is reached."
          success_conditions:
            - Diagnoses each failing judge from summary.yaml rationale, transcripts, and case outputs before editing, noting judge_type (builtin/check/llm/code).
            - Applies surgical, evidence-grounded edits to the target artifact under test (SKILL.md or prompt-mode artifact), not broad rewrites.
            - Re-runs the eval with a --baseline flag and confirms targeted failures now pass while previously passing cases/judges do not regress.
            - Iterates until all judges pass or max-iterations is hit, then reports which edits fixed which failures and the final summary.yaml scores.
          invariants:
            must_preserve:
              - Every edit must be grounded in a specific failure with evidence from judge rationale and transcripts -- never make broad, generic changes.
              - "Do not modify test cases, judges, or eval.yaml; the eval harness is ground truth. Never edit builtin judge code -- suggest adjusting arguments: instead."
              - Check for regressions after every edit; a fix that breaks other cases is not a fix, and must be reverted or reframed.
              - Stop after max-iterations rather than looping forever, and report what could not be fixed.
              - Only edit the artifact under test (the SKILL.md or prompt-mode artifact); make minimal, surgical changes and do not rewrite working sections.
            fixed_context:
              tools: [Read, Write, Edit, Bash, Glob, Grep, Agent, Skill, AskUserQuestion]
              cli: [python3]
              knowledge_inputs:
                - kind: repository_content
                  privacy: public
                - kind: tool_output
                  privacy: task_private
                - kind: task_input
                  privacy: task_private
          source_assertions:
            skill_path: skills/eval-optimize/SKILL.md
      - name: eval-check
        description: Scans a Claude Code harness (skills, commands, CLAUDE.md, hooks) as a system and reports redundancy, trigger overlap, misclassification, and structural issues.
        user-invocable: true
        contract:
          version: canonical-skill-v1
          functions: [analyze, review]
          metrics:
            - id: task_success
              measure: judge
              rubric_ref: opendatahub-io/agent-eval-harness@1559af5d404128ed3458d1a9bdb4580c76244b01:skills/eval-check/SKILL.md
            - id: evidence_completeness
              measure: judge
              rubric_ref: opendatahub-io/agent-eval-harness@1559af5d404128ed3458d1a9bdb4580c76244b01:skills/eval-check/SKILL.md
          problem_statement: Inventory a Claude Code harness and analyze its skills, commands, CLAUDE.md, and hooks as a single system to surface content overlap, trigger overlap, CLAUDE.md duplication, type misclassification, and structural issues, then produce an informational report with actionable restructuring suggestions without modifying any configuration.
          success_conditions:
            - Runs the inventory script and reports the count of skills, commands, hooks, and CLAUDE.md presence with approximate per-skill word counts.
            - Reads every discovered skill's frontmatter and body plus project CLAUDE.md files (and ~/.claude/CLAUDE.md only when --include-global is passed).
            - Produces cross-component findings in all five categories (content overlap, trigger overlap, CLAUDE.md duplication, type misclassification, structural issues), stating 'none detected' where applicable.
            - Writes the report to the --output path only when it resolves inside the project root, and presents a terminal summary with the top actionable suggestions and next steps.
            - Short-circuits to inventory-only reporting when a single skill is found, noting cross-component analysis is not applicable.
          invariants:
            must_preserve:
              - "Read-only: do not modify any skill, command, CLAUDE.md, hook, or other configuration file; only the report is written."
              - Keep all findings informational suggestions; the user decides what to act on.
              - Do not present LLM/qualitative judgments (word counts, overlap) as deterministic or precise measurements.
              - Scan ~/.claude/CLAUDE.md only when --include-global is explicitly passed; otherwise note it was not scanned.
              - Refuse to write the report to a path that resolves outside the project root and ask for a valid path.
              - Skip unreadable files with a note rather than failing the whole report; back findings with concrete component references.
            fixed_context:
              tools: [Read, Bash, Glob, Grep, Agent, AskUserQuestion, Write]
              cli: [python3]
              knowledge_inputs:
                - kind: repository_content
                  privacy: public
                - kind: task_input
                  privacy: task_private
                - kind: tool_output
                  privacy: task_private
          source_assertions:
            skill_path: skills/eval-check/SKILL.md
            supporting_paths:
              - skills/eval-check/scripts/harness_inventory.py
