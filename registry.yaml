                - kind: task_input
                  privacy: task_private
                - kind: tool_output
                  privacy: task_private
          source_assertions:
            skill_path: skills/eval-compare/SKILL.md
            supporting_paths:
              - skills/eval-compare/scripts/compare.py
      - name: eval-anova
        description: Fan a DoE matrix of agent configs across shared cases, then run repeated-measures/mixed-effects ANOVA (F, p, effect size) plus a cost/quality Pareto.
        user-invocable: true
        contract:
          version: canonical-skill-v1
          functions: [orchestrate, analyze]
          metrics:
            - id: task_success
              measure: deterministic
          problem_statement: Run a full-factorial Design-of-Experiments comparison of agent configurations (models, thinking-effort, prompts, or other factors) across a fixed set of test cases by fanning /eval-run out over the matrix, then analyze the resulting standard runs with repeated-measures / mixed-effects ANOVA (F, p, effect size) and a cost/quality Pareto frontier, and render the comparison and statistics reports.
          success_conditions:
            - "Reads the eval.yaml matrix: block, expands the full-factorial grid (conditions x cases x replications), and with --dry-run prints the design and a cost estimate without executing."
            - Drives /eval-run once per condition x replication so each cell lands as a standard run with its own summary.yaml, stamped with a condition.json recording its factor levels.
            - Computes each case composite via the canonical harness reward composition (compose_reward) and writes anova.json containing the ANOVA result (method, F, p, effect size, significance), condition summaries, Pareto frontier, and per-case matrix.
            - Selects repeated-measures ANOVA for single-factor designs and the mixed-effects model for multi-factor designs, restricting the analysis to cases present under every condition.
            - Renders the /eval-compare comparison report and the statistics-forward report.py deep view from on-disk artifacts; --analyze-only re-analyzes existing runs (including externally produced ones) without re-executing.
          invariants:
            must_preserve:
              - "eval-run stays the single-condition primitive: eval-anova only loops it and must not re-implement workspace/execute/collect/score."
              - Repeated-measures ANOVA assumes the same cases run under every condition; keep the design balanced by restricting to common cases and recording excluded cases rather than silently dropping them.
              - Compute case composites via the canonical harness reward composition (compose_reward honouring eval.yaml reward:, else boolean-gate + normalised-numeric average); do not invent a scoring scheme.
              - Do not auto-select plain one-way ANOVA when cases are reused across conditions.
              - Report renderers (report.py, /eval-compare) read only on-disk summary.yaml / anova.json artifacts and never re-run the experiment.
              - A failed matrix cell is logged and skipped so a partial matrix still yields an analysis over the cells that succeeded.
            fixed_context:
              tools: [Read, Bash, Write]
              cli: [python3]
              knowledge_inputs:
                - kind: repository_content
                  privacy: public
                - kind: task_input
                  privacy: task_private
                - kind: tool_output
                  privacy: task_private
          source_assertions:
            skill_path: skills/eval-anova/SKILL.md
            supporting_paths:
              - skills/eval-anova/scripts/orchestrate.py
              - skills/eval-anova/scripts/analyze.py
              - skills/eval-anova/scripts/report.py
              - skills/eval-anova/scripts/design.py
              - skills/eval-anova/references/matrix-schema.md
              - skills/eval-anova/prompts/interpret-anova.md
      - name: eval-review
        description: Interactive human-in-the-loop review of eval judge scores and skill outputs that captures qualitative feedback and proposes targeted SKILL.md improvements.
        user-invocable: true
        contract:
          version: canonical-skill-v1
          functions: [review]
          metrics:
            - id: task_success
              measure: judge
              rubric_ref: opendatahub-io/agent-eval-harness@1559af5d404128ed3458d1a9bdb4580c76244b01:skills/eval-review/prompts/review-results.md
            - id: evidence_completeness
              measure: judge
              rubric_ref: opendatahub-io/agent-eval-harness@1559af5d404128ed3458d1a9bdb4580c76244b01:skills/eval-review/prompts/review-results.md
          problem_statement: "Guide an interactive review of an eval run: present judge scores and skill outputs, collect human feedback on what judges missed, persist that feedback as review.yaml, and propose targeted, evidence-grounded improvements to the artifact under test (SKILL.md or a prompt-mode artifact) and to the judge config."
          success_conditions:
            - Loads the specified run's summary, eval.yaml, and per-case results, and presents pass rates and case-level judge scores with rationale.
            - Collects and persists human feedback to $AGENT_EVAL_RUNS_DIR/<eval-name>/<id>/review.yaml with feedback keys matching case directory names exactly.
            - Identifies judge-human alignment and systematic vs edge-case patterns across the reviewed feedback.
            - Proposes specific before/after edits to the artifact under test, each grounded in cited case feedback, and applies them only after explicit user approval.
          invariants:
            must_preserve:
              - Do not edit the artifact under test without explicit user approval; propose diffs, do not impose them.
              - Keep human feedback separate from judge scores; the skill's value is catching what judges miss.
              - Write review.yaml directly with the Write tool (not state.py) and keep feedback keys identical to case directory names so /eval-optimize and /eval-mlflow can consume them.
              - "Do not flood context: summarize outputs and delegate large transcript analysis to an Agent rather than loading full files."
              - Ground every proposed change and finding in concrete case evidence; do not invent issues unsupported by feedback.
            fixed_context:
              tools: [Read, Write, Edit, Bash, Glob, Grep, Agent, AskUserQuestion, Skill]
              cli: [python3]
              knowledge_inputs:
