          functions: [analyze]
          metrics:
            - id: task_success
              measure: verifier_backed
              verifier_ref: opendatahub-io/autofix-skills@fcabad95d8d15b0f3873fa7361afd08ff586c9c0:skills/autofix-repo-resolve/scripts/validate_verdict.py
          problem_statement: >
            Decide which single repository a Jira bug ticket is actually about when its
            description and comments mention several, classifying every candidate URL and
            recording the chosen target with a confidence level and reasoning.
          success_conditions:
            - Writes .autofix-context/repo-resolve-verdict.json with target_url, confidence, reasoning, and a classification for every candidate URL.
            - Classifies each candidate as target, contextual, negative, or unclear rather than only naming the winner.
            - Passes scripts/write_json.py schema validation and scripts/validate_verdict.py, correcting the JSON and re-validating on failure.
