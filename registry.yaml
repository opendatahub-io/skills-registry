      - name: eval-run
        description: Executes an evaluation against test cases in skill or prompt mode, scores outputs with judges, detects regressions against a baseline, and reports results.
        user-invocable: true
        contract:
          version: canonical-skill-v1
          functions: [execute, verify]
          metrics:
            - id: task_success
              measure: verifier_backed
              verifier_ref: opendatahub-io/agent-eval-harness@1559af5d404128ed3458d1a9bdb4580c76244b01:skills/eval-run/scripts/score.py
            - id: evidence_completeness
              measure: judge
              rubric_ref: opendatahub-io/agent-eval-harness@1559af5d404128ed3458d1a9bdb4580c76244b01:skills/eval-run/prompts/analyze-results.md
          problem_statement: "Run a skill or prompt evaluation end-to-end against a configured dataset: preflight-clean state, prepare an isolated workspace, execute cases headlessly, collect artifacts, score them with configured judges (deterministic and LLM), optionally run pairwise comparison against a baseline to detect regressions, and produce a decisive, evidence-backed analysis plus an HTML report. Requires an eval.yaml config produced by /eval-analyze; the skill orchestrates the pipeline scripts rather than reimplementing their work."
          success_conditions:
            - Discovers or accepts an eval.yaml config, runs preflight, and sets up an isolated workspace with the resolved test cases before executing.
            - Executes the eval headlessly in the correct auto-detected mode (skill mode with arguments, or prompt mode) and confirms run_result.json exit_code is zero before scoring.
            - Collects per-case artifacts and runs every configured judge, honoring --no-llm-judges by skipping LLM judges while still running deterministic ones.
            - Produces summary.yaml with per-judge means/pass-rates and per-case results, and when --baseline is given adds a pairwise regression comparison.
            - Writes a decisive analysis.md leading with a self-contained Recommendation and generates the HTML report.
          invariants:
            must_preserve:
              - Orchestrate by calling the pipeline scripts (preflight, workspace, execute, collect, score, report); never duplicate or reimplement their scoring/execution logic.
              - Launch execute.py in the background with no output redirection (no >, |, tee, or 2>&1) and poll until completion; do not end the turn while it runs.
              - "Fail fast: if execution produces no artifacts or a non-zero exit_code, report it and stop rather than scoring empty outputs."
              - Never read large artifact files into context; rely on summary.yaml and delegate content analysis to agents.
              - When inputs.tools is configured, resolve every tool handler (input_filters for Bash) before executing; do not skip this mandatory step.
              - "Honor run isolation: do not overwrite a prior run's results without cleaning, and persist state via state.py at each step."
            fixed_context:
              tools: [Read, Write, Edit, Bash, Glob, Grep, Agent, Skill, AskUserQuestion]
              cli: [python3]
              knowledge_inputs:
                - kind: repository_content
                  privacy: public
                - kind: task_input
                  privacy: task_private
                - kind: tool_output
                  privacy: task_private
          source_assertions:
            skill_path: skills/eval-run/SKILL.md
            supporting_paths:
              - skills/eval-run/scripts/execute.py
              - skills/eval-run/scripts/score.py
              - skills/eval-run/scripts/collect.py
              - skills/eval-run/scripts/report.py
              - skills/eval-run/scripts/preflight.py
              - skills/eval-run/prompts/analyze-results.md
              - skills/eval-run/prompts/comparison-judge.md
              - skills/eval-run/references/execution-modes.md
      - name: eval-compare
        description: Discovers a directory of eval run artifacts and generates a self-contained tabbed HTML comparison report with model cards, quality/cost tables, per-case breakdowns, and LLM-written analysis.
        user-invocable: true
        contract:
          version: canonical-skill-v1
          functions: [analyze, generate]
          metrics:
            - id: task_success
              measure: judge
              rubric_ref: opendatahub-io/agent-eval-harness@1559af5d404128ed3458d1a9bdb4580c76244b01:skills/eval-compare/SKILL.md
            - id: evidence_completeness
              measure: judge
              rubric_ref: opendatahub-io/agent-eval-harness@1559af5d404128ed3458d1a9bdb4580c76244b01:skills/eval-compare/SKILL.md
          problem_statement: Take a directory of eval run artifacts (summary.yaml, run_result.json, optional report.html and anova.json), discover and aggregate runs per model, and produce a self-contained tabbed HTML comparison report whose LLM-written analysis sections (verdict, badges, strengths, shared weaknesses, recommendations) are grounded in the per-case scores and cost data.
          success_conditions:
            - Runs the discover and generate subcommands of compare.py to find every subdirectory containing summary.yaml and emit index.html plus per-run report.html copies for iframe embedding.
            - Replaces the generated placeholder sections (Bottom Line verdict, Where Each Model Shined, Shared Weaknesses, Recommendations) with analysis grounded in each run's summary.yaml per-case scores, judge breakdowns, and cost data.
            - Adds Best Value / Highly Variable / Not Viable badges only when they clearly apply, honoring the mutual-exclusivity rules (a highly variable model is never Best Value).
            - Includes runs with missing run_result.json or report.html via graceful degradation, and aggregates repeated models as averages with min/max ranges.
          invariants:
            must_preserve:
              - Do not modify or write to any input/source file; only write to the output directory.
              - Do not run evaluations or compute statistics -- render pre-computed anova.json numbers only, never import scipy/statsmodels/pingouin.
              - Do not explore the input directory manually (no ls/find); let compare.py handle all run discovery.
              - Do not invent findings, badges, or verdicts unsupported by the per-case scores and cost data.
              - Preserve graceful degradation and per-model aggregation (averages with min/max ranges) so partial or repeated runs are still included.
            fixed_context:
              tools: [Read, Write, Edit, Bash, Glob, Grep, AskUserQuestion]
              cli: [python3]
              knowledge_inputs:
